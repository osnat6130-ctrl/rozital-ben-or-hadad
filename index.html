<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E8E9E" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ‼️ TODO: להחליף לדומיין האמיתי כשיהיה (גם ב-src/data/site.ts, sitemap.xml, robots.txt) -->
    <link rel="canonical" href="https://rozital.co.il/" />

    <title>רוזיטל בן אור חדד | הרצאות להורים, יוגה צחוק ופעילות בת מצווה</title>
    <meta
      name="description"
      content="רוזיטל בן אור חדד - הרצאות להורים לילדים עם צרכים מיוחדים, סדנאות יוגה צחוק ופעילות בת מצווה. חוויה מקצועית, חמה ומלאת שמחה. למצוא את האור בכל אחד."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="רוזיטל בן אור חדד" />
    <meta property="og:title" content="רוזיטל בן אור חדד | הרצאות, יוגה צחוק ובת מצווה" />
    <meta
      property="og:description"
      content="הרצאות להורים לילדים עם צרכים מיוחדים, סדנאות יוגה צחוק ופעילות בת מצווה - בליווי אישי, מקצועי ומלא שמחה."
    />
    <!-- ‼️ TODO: להחליף לתמונת שיתוף ייעודית 1200x630 (public/og-image.jpg) -->
    <meta property="og:image" content="https://rozital.co.il/logo-original.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Sans - הפונט היחיד באתר. תומך עברית ומשקלים 400-700. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // משחזר את הנתיב ששמר public/404.html - ראו הסבר שם.
      // חייב לרוץ לפני שה-React Router מתחיל, אחרת יטען את דף הבית תמיד.
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          history.replaceState(null, "", location.pathname.replace(/\/$/, "") + redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
